# Konteks server situs undangan (aaPanel: tambahkan ke URL rewrite situs invitation.helonoia.com,
# berkas /www/server/panel/vhost/rewrite/invitation.helonoia.com.conf).
# ^~ supaya aturan regex lain di situs (gambar, js/css) tidak mengambil alih jalur /api/.
location ^~ /api/ {
    limit_req zone=mengundang_tulis burst=5 nodelay;
    limit_req zone=mengundang_baca burst=20 nodelay;
    limit_req_status 429;
    # Penolakan batas laju tidak dicatat: level info di bawah level error_log situs (error).
    limit_req_log_level info;
    client_max_body_size 8k;
    # API dan database tidak menyimpan IP tamu; log akses untuk /api/ juga dimatikan.
    access_log off;

    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
