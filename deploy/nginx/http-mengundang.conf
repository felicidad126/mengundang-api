# Konteks http nginx (aaPanel: /www/server/panel/vhost/nginx/0.mengundang-api.conf).
# Zona pembatas laju untuk /api/. Kunci kosong = tidak dibatasi zona itu.

# Tulis (POST/PUT): 10 per menit per IP, cukup untuk satu tamu mengirim RSVP dan ucapan berkali-kali.
map $request_method $mengundang_kunci_tulis {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
}
limit_req_zone $mengundang_kunci_tulis zone=mengundang_tulis:10m rate=10r/m;

# Baca (semua metode): 5 per detik per IP, menahan pengambilan massal daftar ucapan.
limit_req_zone $binary_remote_addr zone=mengundang_baca:10m rate=5r/s;
